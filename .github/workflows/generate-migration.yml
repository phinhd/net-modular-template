name: Generate migration (temporary)

on:
  push:
    branches: [chore/production-ready]

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet build src/Host/WebApi/WebApi.csproj
      - name: Add InitialUsers migration
        if: ${{ hashFiles('src/Modules/Users/Users.Infrastructure/Persistence/Migrations/*.cs') == '' }}
        run: >
          dotnet ef migrations add InitialUsers
          -p src/Modules/Users/Users.Infrastructure
          -s src/Host/WebApi
          -c UsersDbContext
          -o Persistence/Migrations
        env:
          ASPNETCORE_ENVIRONMENT: Development
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Modules/Users/Users.Infrastructure/Persistence/Migrations
          git diff --cached --quiet || (git commit -m "feat(users): add InitialUsers migration" && git push)
